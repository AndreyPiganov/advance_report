name: advance-report

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-advance_report}
      POSTGRES_USER: ${POSTGRES_USER:-advance_report}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-advance_report_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migration
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-advance_report}:${POSTGRES_PASSWORD:-advance_report_local}@postgres:5432/${POSTGRES_DB:-advance_report}
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /app/data
      IMPORT_CRON: ${IMPORT_CRON:-0 * * * *}
      IMPORT_TIME_ZONE: ${IMPORT_TIME_ZONE:-Europe/Moscow}
      DATABASE_URL: postgresql://${POSTGRES_USER:-advance_report}:${POSTGRES_PASSWORD:-advance_report_local}@postgres:5432/${POSTGRES_DB:-advance_report}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: ${DATA_DIR:-./backend/data}
        target: /app/data
        read_only: true
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped


  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
      target: production
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
